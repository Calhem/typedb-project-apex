# Continuous integration: on every push and pull request, build and start the whole stack from scratch
# exactly as the README says, then run the test suite and the end-to-end browser check against it.
# Not yet run on GitHub (added in Phase 6H before the first push): check the first run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and start the stack (seeds the apex database)
        run: |
          docker compose up -d --build
          for i in $(seq 60); do curl -sf http://127.0.0.1:8091/api/health && exit 0; sleep 2; done; exit 1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2 (no short v10 tag)
        with:
          version: "0.13.5"

      - name: Build the frontend (for the bundle scan test)
        run: scripts/npm-docker.sh npm ci --no-audit --no-fund && scripts/npm-docker.sh npm run build

      - name: Tests
        run: uv run pytest -q

      - name: End-to-end check (headless Chrome, 127.0.0.1 only)
        run: uv run python -m scripts.e2e_check

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
