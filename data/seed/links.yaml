# A deadline doesn't move when things slip: it gets breached.
deadline_limits:
  - {deadline: DL-LONGSTOP, item: MS-COMPLETION}
  - {deadline: DL-HELIX-WAIVER, item: MS-COMPLETION}
  - {deadline: DL-FUNDS, item: MS-FUNDS}
  - {deadline: DL-FUNDS, item: OB-SETTLE}

# One review per authority (the HSR filing goes to both the FTC and the DOJ).
reviews:
