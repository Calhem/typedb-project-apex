  - {subject: CP-CMA, reviewer: ORG-CMA, applicant: ORG-NOV, legal_basis: Enterprise Act 2002, phase: Phase 1 (40 working days)}
  - {subject: CP-COURT, reviewer: ORG-HCJ, applicant: ORG-ATL, legal_basis: 'Companies Act 2006, Part 26', phase: Sanction hearing}

