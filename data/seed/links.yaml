  - {subject: CP-HSR, reviewer: ORG-DOJ, applicant: ORG-NOV, legal_basis: Hart-Scott-Rodino Act, phase: Initial 30-day waiting period}
  - {subject: CP-NSIA, reviewer: ORG-ISU, applicant: ORG-NOV, legal_basis: National Security and Investment Act 2021, phase: Review period (30 working days)}
