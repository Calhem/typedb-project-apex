# Direct legal shareholdings. Stakes are strings so they stay exact ("0.7" = 70%). No cross-shareholdings,
# by design: the loader refuses ownership cycles (a deliberate simplification; docs/schema-design.md §4).
ownership:
  - {owner: ORG-ATL, owned: ORG-ATL-UK, stake: '1.0', description: 'Atlas Biopharma plc''s main operating subsidiary, wholly owned.'}
  - {owner: ORG-ATL-UK, owned: ORG-ATL-US, stake: '1.0', description: 'The US commercial arm, wholly owned by the UK operating company.'}
  - {owner: ORG-ATL-UK, owned: ORG-ATL-IE, stake: '1.0', description: 'The Irish manufacturing company, wholly owned by the UK operating company.'}
  - {owner: ORG-ATL-IE, owned: ORG-ATL-DE, stake: '1.0', description: 'EU distribution, held from Ireland so that it sits inside the EU.'}
  - {owner: ORG-ATL-IE, owned: ORG-ATL-JV, stake: '0.6', description: 'Majority stake in the manufacturing joint venture. Helix holds the other 40%, with two of five board seats, a veto over reserved matters (budget, new products, a change of manufacturer) and a call option over this stake if Atlas changes control.'}
  - {owner: ORG-HELIX, owned: ORG-ATL-JV, stake: '0.4', description: 'The joint-venture partner''s minority stake, with two board seats, reserved-matter vetoes and the change-of-control call option.'}
  - {owner: ORG-ATL-UK, owned: ORG-ATL-IP, stake: '0.7', description: The UK operating company's founding stake in the IP holding company.}
  - {owner: ORG-ATL-US, owned: ORG-ATL-IP, stake: '0.2', description: 'Issued to Atlas Therapeutics Inc in 2021, when it contributed its US-origin patents to the IP holding company.'}
  - {owner: ORG-CALDER, owned: ORG-ATL-IP, stake: '0.1', description: 'University spin-out equity received for licensing the founding patents. Calder''s consent is needed to assign or sub-license the core patents (a reserved matter), separate from its change-of-control consent under the licence.'}
