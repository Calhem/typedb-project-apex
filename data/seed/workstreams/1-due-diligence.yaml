# FICTIONAL DEMONSTRATION DATA. All companies, people and events are invented; real public authorities
# appear only in an invented scenario. See docs/dataset.md.
#
# Due Diligence workstream. Items, the dependencies INTO them, who is responsible (RACI) and what has
# happened (the activity history). Lags are calendar days. Workstream progress is not stored: it is derived
# from the items (docs/phase6-plan.md §12).

workstreams:
  - {code: WS-DD, name: Due Diligence, status: complete, planned_start: 2026-05-18, due: 2026-06-26, criticality: high, description: 'Confirmatory financial, tax, legal, commercial and IP due diligence on Atlas before the firm offer, run through a virtual data room with management Q&A.'}

# Activities have a planned start and a due date; milestones and conditions are points in time.
items:
  - {code: AC-DD-VDR, type: activity, name: Data room review and document requests, workstream: WS-DD, status: complete, planned_start: 2026-05-18, due: 2026-06-12, criticality: medium, progress: 100, description: Atlas's virtual data room opened to Novacore's advisers under the non-disclosure agreement; every document request tracked to closure.}
  - {code: AC-DD-FINWORK, type: activity, name: Financial and tax diligence fieldwork, workstream: WS-DD, status: complete, planned_start: 2026-05-25, due: 2026-06-17, criticality: high, progress: 100}
  - {code: AC-DD-LEGWORK, type: activity, name: 'Legal diligence: contracts, litigation and change-of-control terms', workstream: WS-DD, status: complete, planned_start: 2026-05-25, due: 2026-06-19, criticality: high, progress: 100}
  - {code: AC-DD-QA, type: activity, name: Management presentations and Q&A, workstream: WS-DD, status: complete, planned_start: 2026-05-26, due: 2026-06-05, criticality: medium, progress: 100}
  - {code: AC-DD-IP, type: activity, name: IP and licensing diligence, workstream: WS-DD, status: complete, planned_start: 2026-06-01, due: 2026-06-19, criticality: high, progress: 100, description: 'Patent ownership and licences. Found the two change-of-control provisions the deal must manage: the Calder licence and Helix''s call option over the manufacturing joint venture.'}
  - {code: MS-DD-FIN, type: milestone, name: Financial and tax due diligence report, workstream: WS-DD, status: complete, progress: 100, due: 2026-06-19}
  - {code: MS-DD-LEGAL, type: milestone, name: Legal due diligence report, workstream: WS-DD, status: complete, progress: 100, due: 2026-06-22}
  - {code: MS-DD, type: milestone, name: Due diligence complete, workstream: WS-DD, status: complete, progress: 100, due: 2026-06-26, criticality: high}

# gating: a condition must be met first; sequencing: X must finish before Y;
# informing: soft, Y needs input from X and dates don't move.
dependencies:
  - {kind: sequencing, from: MS-DD-FIN, to: MS-DD, lag: 0}
  - {kind: sequencing, from: MS-DD-LEGAL, to: MS-DD, lag: 0}
  - {kind: informing, from: AC-DD-QA, to: AC-DD-FINWORK, lag: 0}
  - {kind: sequencing, from: AC-DD-FINWORK, to: MS-DD-FIN, lag: 0}
  - {kind: sequencing, from: AC-DD-LEGWORK, to: MS-DD-LEGAL, lag: 0}
  - {kind: sequencing, from: AC-DD-IP, to: MS-DD, lag: 0}

# Exactly one Accountable per item; holders are people (PER-) or organisations (ORG-).
raci:
  WS-DD: {A: PER-OKAFOR, R: [PER-NAIR, PER-AINSWORTH], I: [PER-ADEBAYO]}
  AC-DD-VDR: {A: PER-OKAFOR, R: [PER-AINSWORTH], C: [PER-PRITCHARD], I: [PER-NAIR]}
  AC-DD-FINWORK: {A: PER-ADEBAYO, R: [PER-NAIR, PER-LIU], C: [PER-DONNELLY]}
  AC-DD-LEGWORK: {A: PER-LINDQVIST, R: [PER-AINSWORTH, PER-KINGSLEY], C: [PER-REID]}
  AC-DD-QA: {A: PER-OKAFOR, R: [PER-THORNTON], C: [PER-MENON, PER-DONNELLY], I: [PER-HARTLEY]}
  AC-DD-IP: {A: PER-LINDQVIST, R: [PER-KINGSLEY], C: [PER-REID], I: [PER-OKAFOR]}
  MS-DD-FIN: {A: PER-ADEBAYO, R: [PER-NAIR], I: [PER-OKAFOR]}
