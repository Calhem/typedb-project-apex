# FICTIONAL DEMONSTRATION DATA. All companies, people and events are invented; real public authorities
# appear only in an invented scenario. See docs/dataset.md.
#
# Legal and Scheme workstream. Items, the dependencies INTO them, who is responsible (RACI) and what has
# happened (the activity history). Lags are calendar days. Workstream progress is not stored: it is derived
# from the items (docs/phase6-plan.md §12).

workstreams:
  - {code: WS-LEG, name: Legal and Scheme, status: in-progress, planned_start: 2026-06-22, due: 2026-12-03, criticality: critical, description: 'The Takeover Code and court process that delivers Atlas to Novacore: the co-operation agreement and Rule 2.7 announcement, the scheme document and court hearings, shareholder approval, change-of-control consents, and Atlas''s conduct of business until completion.'}

# Activities have a planned start and a due date; milestones and conditions are points in time.
items:
  - {code: AC-LEG-COOP, type: activity, name: Co-operation agreement and Rule 2.7 announcement, workstream: WS-LEG, status: complete, planned_start: 2026-06-22, due: 2026-07-13, criticality: critical, progress: 100}
  - {code: AC-LEG-IRREV, type: activity, name: Irrevocable undertakings from Atlas's directors, workstream: WS-LEG, status: complete, planned_start: 2026-07-01, due: 2026-07-13, criticality: high, progress: 100}
  - {code: MS-ANNOUNCE, type: milestone, name: Firm offer announced (Rule 2.7), workstream: WS-LEG, status: complete, progress: 100, due: 2026-07-14, criticality: critical}
  - {code: AC-LEG-CONSENTS, type: activity, name: Change-of-control consents programme, workstream: WS-LEG, status: complete, planned_start: 2026-07-14, due: 2026-10-14, criticality: critical, progress: 100, description: 'Approach the counterparties with change-of-control rights (Calder under the patent licence, Helix under the joint-venture agreement) and obtain their consents.'}
  - {code: CV-CONDUCT, type: covenant, name: Atlas ordinary-course operating restrictions end, workstream: WS-LEG, status: in-progress, progress: 55, planned_start: 2026-07-14, due: 2026-12-02, criticality: medium, legal_basis: Co-operation agreement, description: Atlas must run its business in the ordinary course until completion.}
  - {code: AC-LEG-CLAIM, type: activity, name: Scheme claim form and evidence filed with the court, workstream: WS-LEG, status: complete, planned_start: 2026-07-15, due: 2026-07-21, criticality: high, progress: 100, description: 'Filed in good time before the convening hearing, at which the court decides whether the shareholder meetings can be called.'}
  - {code: AC-LEG-SCHEMEDOC, type: activity, name: Draft and verify the scheme document, workstream: WS-LEG, status: complete, planned_start: 2026-07-15, due: 2026-08-10, criticality: high, progress: 100}
  - {code: MS-CONVENE, type: milestone, name: Court convening hearing, workstream: WS-LEG, status: complete, due: 2026-08-04, criticality: high, progress: 100, description: The court orders the Court Meeting and approves the explanatory statement in the scheme document.}
  - {code: MS-SCHEME-DOC, type: milestone, name: Scheme document published, workstream: WS-LEG, status: complete, progress: 100, due: 2026-08-11, criticality: high, description: 'Published within 28 days of the firm offer announcement, as the Code requires.'}
  - {code: AC-LEG-MEETINGS, type: activity, name: Proxy solicitation and shareholder meetings, workstream: WS-LEG, status: complete, planned_start: 2026-08-11, due: 2026-09-07, criticality: critical, progress: 100, description: The registrar counts proxies for the Court Meeting (a majority in number holding 75% by value) and the General Meeting.}
  - {code: CP-SHAREHOLDERS, type: shareholder-approval, name: Scheme approved by Atlas shareholders, workstream: WS-LEG, status: complete, progress: 100, due: 2026-09-07, criticality: critical, legal_basis: 'Companies Act 2006, Part 26', description: Approved at the Court Meeting and General Meeting.}
  - {code: CV-COC-CALDER, type: covenant, name: 'Calder licence: change-of-control consent', workstream: WS-LEG, status: complete, progress: 100, due: 2026-10-09, criticality: high, legal_basis: Calder patent licence, description: "Calder's consent to Atlas IP Holdings' change of control, received unconditionally."}
  - {code: CV-COC-HELIX, type: covenant, name: Helix waiver of its change-of-control call option, workstream: WS-LEG, status: complete, progress: 100, due: 2026-10-14, criticality: critical, legal_basis: Helix Atlas Manufacturing shareholders' agreement, description: 'Helix has signed a waiver of its call option, but only on condition that completion happens by 31 January 2027 (see DL-HELIX-WAIVER).'}
  - {code: AC-LEG-SANCTION, type: activity, name: Prepare the sanction hearing, workstream: WS-LEG, status: not-started, planned_start: 2026-11-02, due: 2026-11-25, criticality: critical, progress: 0}
  - {code: AC-LEG-DELIST, type: activity, name: Cancellation of listing and re-registration applications, workstream: WS-LEG, status: not-started, planned_start: 2026-11-18, due: 2026-12-02, criticality: medium, progress: 0}
  - {code: CP-COURT, type: court-sanction, name: Court sanction hearing, workstream: WS-LEG, status: not-started, progress: 0, due: 2026-11-30, criticality: critical, legal_basis: 'Companies Act 2006, Part 26', description: Held once every other condition is satisfied or waived.}
  - {code: MS-COMPLETION, type: milestone, name: 'Scheme effective: completion', workstream: WS-LEG, status: not-started, progress: 0, due: 2026-12-02, criticality: critical, description: The court order is delivered to the Registrar of Companies and the scheme takes effect.}
  - {code: MS-DELIST, type: milestone, name: Atlas shares delisted, workstream: WS-LEG, status: not-started, progress: 0, due: 2026-12-03, criticality: medium}
  - {code: DL-HELIX-WAIVER, type: deadline, name: 'Helix waiver: completion deadline', workstream: WS-LEG, status: in-progress, due: 2027-01-31, criticality: critical, legal_basis: Helix waiver letter (14 October 2026), consequence: 'The waiver lapses and Helix''s change-of-control call option revives: Helix may buy Atlas Biologics Ireland''s 60% of Helix Atlas Manufacturing, which makes Atlas''s lead product, at the shareholders'' agreement''s fair-value price. If Helix exercised the option, Novacore could lose control of manufacturing.'}
  - {code: DL-LONGSTOP, type: deadline, name: Long-stop date, workstream: WS-LEG, status: in-progress, due: 2027-03-31, criticality: critical, legal_basis: 'Takeover Code, Appendix 7; scheme conditions', consequence: 'If the scheme is not effective by this date it lapses, unless Novacore extends the date with Atlas''s agreement (Panel consent is needed only in a competitive situation; the extension must be announced).'}

