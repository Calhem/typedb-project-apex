# FICTIONAL DEMONSTRATION DATA. All companies, people and events are invented; real public authorities
# appear only in an invented scenario. See docs/dataset.md.
#
# Regulatory workstream. Items, the dependencies INTO them, who is responsible (RACI) and what has
# happened (the activity history). Lags are calendar days. Workstream progress is not stored: it is derived
# from the items (docs/phase6-plan.md §12).

workstreams:
  - {code: WS-REG, name: Regulatory, status: at-risk, planned_start: 2026-07-15, due: 2026-11-16, criticality: critical, description: 'The merger-control and foreign-investment approvals the scheme is conditional on: US HSR, the UK National Security and Investment Act, EU merger control and the CMA''s Phase 1 review, including pre-notification and the CMA''s issues process.'}

# Activities have a planned start and a due date; milestones and conditions are points in time.
items:
  - {code: AC-REG-HSR, type: activity, name: Prepare and file the HSR notifications, workstream: WS-REG, status: complete, planned_start: 2026-07-15, due: 2026-08-03, criticality: high, progress: 100}
