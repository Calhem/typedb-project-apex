# gating: a condition must be met first; sequencing: X must finish before Y;
# informing: soft, Y needs input from X and dates don't move.
dependencies:
  - {kind: sequencing, from: AC-REG-HSR, to: CP-HSR, lag: 0}
  - {kind: sequencing, from: AC-REG-NSIA, to: CP-NSIA, lag: 0}
  - {kind: sequencing, from: AC-REG-EC-PRE, to: CP-EC, lag: 0}
  - {kind: sequencing, from: AC-REG-CMA-PRE, to: CP-CMA, lag: 0}
  - {kind: sequencing, from: AC-REG-CMA-RFI, to: CP-CMA, lag: 0}
  - {kind: sequencing, from: MS-CMA-ISSUES, to: AC-REG-CMA-RESP, lag: 0}
  - {kind: sequencing, from: AC-REG-CMA-RESP, to: MS-CMA-MEETING, lag: 0}
  - {kind: sequencing, from: MS-CMA-MEETING, to: CP-CMA, lag: 0}
  - {kind: informing, from: MS-CMA-ISSUES, to: AC-REG-REMEDIES, lag: 0}
  - {kind: informing, from: AC-REG-REMEDIES, to: CP-CMA, lag: 0}

