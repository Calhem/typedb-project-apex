  - {code: AC-INT-DAY1, type: activity, name: Day-1 readiness checklist, workstream: WS-INT, status: in-progress, planned_start: 2026-09-01, due: 2026-11-24, criticality: high, progress: 70}
  - {code: AC-INT-INTERIM, type: activity, name: Interim finance and IT arrangements for Day 1, workstream: WS-INT, status: in-progress, planned_start: 2026-10-01, due: 2026-11-30, criticality: high, progress: 30}
  - {code: IN-SYNERGY, type: milestone, name: Synergy plan baseline approved, workstream: WS-INT, status: in-progress, progress: 50, due: 2026-11-13, criticality: medium}
  - {code: MS-IMO-READY, type: milestone, name: Day-1 readiness sign-off, workstream: WS-INT, status: in-progress, progress: 70, due: 2026-11-25, criticality: high}
  - {code: MS-DAY1, type: milestone, name: 'Day 1: combined operations start', workstream: WS-INT, status: not-started, progress: 0, due: 2026-12-02, criticality: critical}
  - {code: AC-INT-SYSTEMS, type: activity, name: Finance systems migration, workstream: WS-INT, status: not-started, planned_start: 2026-12-03, due: 2027-01-04, criticality: medium, progress: 0}
  - {code: AC-INT-100DAY, type: activity, name: 100-day plan delivery, workstream: WS-INT, status: not-started, planned_start: 2026-12-03, due: 2027-03-12, criticality: medium, progress: 0}
  - {code: IN-SYSTEMS, type: milestone, name: Finance systems cut-over, workstream: WS-INT, status: not-started, progress: 0, due: 2027-01-04, criticality: medium}
  - {code: MS-DAY100, type: milestone, name: Day-100 integration review, workstream: WS-INT, status: not-started, progress: 0, due: 2027-03-12, criticality: medium}

# gating: a condition must be met first; sequencing: X must finish before Y;
# informing: soft, Y needs input from X and dates don't move.
dependencies:
  - {kind: sequencing, from: MS-COMPLETION, to: MS-DAY1, lag: 0}
  - {kind: sequencing, from: MS-DAY1, to: IN-SYSTEMS, lag: 33}
  - {kind: sequencing, from: MS-DAY1, to: MS-DAY100, lag: 100}
  - {kind: informing, from: MS-IMO-READY, to: MS-DAY1, lag: 0}
  - {kind: informing, from: HR-CONSULT, to: MS-DAY1, lag: 0}
  - {kind: informing, from: IN-SYNERGY, to: MS-DAY100, lag: 0}
  - {kind: informing, from: AC-INT-CLEAN, to: IN-SYNERGY, lag: 0}
  - {kind: sequencing, from: AC-INT-SYNERGY, to: IN-SYNERGY, lag: 0}
  - {kind: sequencing, from: AC-INT-DAY1, to: MS-IMO-READY, lag: 0}
  - {kind: sequencing, from: AC-INT-INTERIM, to: MS-DAY1, lag: 0}
  - {kind: sequencing, from: MS-DAY1, to: AC-INT-SYSTEMS, lag: 1}
  - {kind: sequencing, from: AC-INT-SYSTEMS, to: IN-SYSTEMS, lag: 0}
  - {kind: sequencing, from: MS-DAY1, to: AC-INT-100DAY, lag: 1}
  - {kind: sequencing, from: AC-INT-100DAY, to: MS-DAY100, lag: 0}

