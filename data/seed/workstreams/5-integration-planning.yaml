# FICTIONAL DEMONSTRATION DATA. All companies, people and events are invented; real public authorities
# appear only in an invented scenario. See docs/dataset.md.
#
# Integration Planning workstream. Items, the dependencies INTO them, who is responsible (RACI) and what has
# happened (the activity history). Lags are calendar days. Workstream progress is not stored: it is derived
# from the items (docs/phase6-plan.md §12).

workstreams:
  - {code: WS-INT, name: Integration Planning, status: in-progress, planned_start: 2026-08-03, due: 2027-03-12, criticality: high, description: 'Planning to run the combined business from Day 1: the Integration Management Office, a clean-team process for competitively sensitive data, the synergy baseline, interim finance and IT arrangements, and the first 100 days.'}

# Activities have a planned start and a due date; milestones and conditions are points in time.
items:
  - {code: AC-INT-IMO, type: activity, name: Set up the Integration Management Office, workstream: WS-INT, status: complete, planned_start: 2026-08-03, due: 2026-08-28, criticality: medium, progress: 100}
