  - {kind: sequencing, from: MS-COMPLETION, to: CV-RETENTION, lag: 182}
  - {kind: informing, from: AC-PPL-RETAIN, to: CV-RETENTION, lag: 0}
  - {kind: sequencing, from: AC-PPL-MATERIALS, to: HR-CONSULT, lag: 0}
  - {kind: sequencing, from: AC-PPL-IRELAND, to: HR-CONSULT, lag: 0}
  - {kind: sequencing, from: AC-PPL-LEADERS, to: HR-ORG, lag: 0}
  - {kind: sequencing, from: MS-COMPLETION, to: AC-PPL-AWARDS, lag: 152}
